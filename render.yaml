# Render.com Blueprint — full IDFB ERP stack (API + Postgres + Redis + Web).
# Deploy: push to GitHub → Render Dashboard → New → Blueprint → pick this repo.
# Render provisions everything and wires the marked env vars automatically.
# Note: managed Postgres/Key-Value and always-on services are paid tiers on
# Render; review pricing before applying.

databases:
  - name: idfb-postgres
    databaseName: idfb_erp
    plan: free

services:
  # Redis / Key-Value store
  - type: keyvalue
    name: idfb-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # Backend API (Docker) — runs migrations + seed on boot via its entrypoint
  - type: web
    name: idfb-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: idfb-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: idfb-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: idfb-redis
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The web frontend proxies through its own origin, so CORS is only
      # relevant for callers hitting the API directly.
      - key: CORS_ORIGINS
        value: https://idfb-web.onrender.com
      # Demo administrator provisioned by the seed on first boot.
      # Change the password from inside the app after the first login.
      - key: SEED_DEMO_EMAIL
        value: demo@idfb.app
      - key: SEED_DEMO_PASSWORD
        value: Demo1234

  # Frontend (Docker, Next.js standalone)
  - type: web
    name: idfb-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      # Backend the same-origin /api/v1 proxy forwards to. Read at request
      # time, so changing it needs a restart but never a rebuild.
      - key: API_PROXY_TARGET
        value: https://idfb-api.onrender.com
