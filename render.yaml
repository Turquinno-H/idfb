# Render.com Blueprint — full IDFB ERP stack (API + Postgres + Redis + Web).
# Deploy: push to GitHub → Render Dashboard → New → Blueprint → pick this repo.
# Render provisions everything and wires the marked env vars automatically.
# Note: managed Postgres/Key-Value and always-on services are paid tiers on
# Render; review pricing before applying.

databases:
  - name: idfb-postgres
    databaseName: idfb_erp
    plan: free

services:
  # Redis / Key-Value store
  - type: keyvalue
    name: idfb-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # Backend API (Docker) — runs migrations + seed on boot via its entrypoint
  - type: web
    name: idfb-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: idfb-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: idfb-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: idfb-redis
          property: port
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Set to the deployed web URL after the first deploy (CORS).
      - key: CORS_ORIGINS
        sync: false

  # Frontend (Docker, Next.js standalone)
  - type: web
    name: idfb-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      # Build-time public API URL — set to the API service URL, e.g.
      # https://idfb-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_URL
        sync: false
